global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client  30s
    timeout server  30s

# Docker's interne DNS, zodat HAProxy containers op naam vindt.
# Hier hoef je niks aan te doen.
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s

frontend website
    bind *:8080
    # Geen caching, anders zie je de wissel tussen servers niet
    http-response set-header Cache-Control no-store
    default_backend webservers

backend webservers
    # TODO 1: kies hoe het verkeer verdeeld wordt.
    #         Zoek op: "haproxy balance roundrobin"


    # TODO 2: voeg je drie webservers toe. De eerste staat er als voorbeeld
    #         (haal het # weg). Maak de andere twee zelf.
    # server web1 web1:80 resolvers docker init-addr libc,none


    # TODO 3: NIET NU! Pas na stap 5 op je opdrachtblad (health checks).


listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
