global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client  30s
    timeout server  30s

# Docker's interne DNS, zodat HAProxy containers op naam vindt
# en een nieuw IP oppikt als een container opnieuw start
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s

frontend website
    bind *:8080
    # Geen caching, anders zie je de wissel tussen servers niet
    http-response set-header Cache-Control no-store
    default_backend webservers

backend webservers
    balance roundrobin

    # Health check: vraag elke 2s de homepage op, 2x fout = DOWN, 2x goed = weer UP
    option httpchk GET /
    http-check expect status 200
    default-server inter 2s fall 2 rise 2

    server web1 web1:80 check resolvers docker init-addr libc,none
    server web2 web2:80 check resolvers docker init-addr libc,none
    server web3 web3:80 check resolvers docker init-addr libc,none
    # Bonus: vierde server
    # server web4 web4:80 check resolvers docker init-addr libc,none

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
